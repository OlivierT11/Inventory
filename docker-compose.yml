#  This file is used by: docker-compose up --build 
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: inventory-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "InventoryDb2026Strong"
      MSSQL_TCP_PORT: "1433"
    ports:
      - "1433:1433"

  api:
    build:
      context: ./Inventory_Api/Inventory
      dockerfile: Dockerfile
    container_name: inventory-api
    ports:
      - "5293:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      - sqlserver

  client:
    build:
      context: ./Inventory_React
      dockerfile: Dockerfile
    container_name: inventory-client
    ports:
      - "5173:80"
    depends_on:
      - api
