name: ASP.NET Core CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: aspnet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  CONFIGURATION: Release
  SOLUTION_FILE: ./Inventory_Api/Inventory.slnx

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          
      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Run tests
        run: >
          dotnet test ${{ env.SOLUTION_FILE }}
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          --verbosity normal
          --collect:"XPlat Code Coverage"

      - name: Publish application
        run: >
          dotnet publish
          ./Inventory_Api/Inventory/Inventory.csproj
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          --output ./publish

      - name: Upload published application
        uses: actions/upload-artifact@v4
        with:
          name: inventory-api-app
          path: ./publish
