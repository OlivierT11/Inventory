name: ASP.NET Core CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: aspnet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  CONFIGURATION: Release
  SOLUTION_FILE: ./Inventory_Api/Inventory.slnx

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Run tests with coverage
        run: >
          dotnet test ${{ env.SOLUTION_FILE }}
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --results-directory "./TestResults"
          --collect:"XPlat Code Coverage"

      - name: Upload test and coverage results as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage
          path: |
            ./TestResults/**/*.trx
            ./TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool
      
      - name: Generate human-readable HTML coverage report from coverage.cobertura.xml
        run: >
          reportgenerator
          -reports:./TestResults/**/coverage.cobertura.xml
          -targetdir:./coverage-report
          -reporttypes:Html
      
      - name: Upload HTML coverage report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage-report
    
      - name: Publish application
        run: >
          dotnet publish
          ./Inventory_Api/Inventory/Inventory.csproj
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          --output ./publish

      - name: Upload published application
        uses: actions/upload-artifact@v4
        with:
          name: inventory-api-app
          path: ./publish

  docker-compose:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker Compose services
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Show running containers
        run: docker compose ps

      - name: Show logs
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down
